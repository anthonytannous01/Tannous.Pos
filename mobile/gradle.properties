# Gradle properties for Tannous POS Android App

# Build Configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=34
kotlin.suppressKotlinVersionCompatibilityCheck=true

# Version Configuration
VERSION_NAME=1.0.0
VERSION_CODE=1

# Signing Configuration (DO NOT COMMIT ACTUAL VALUES)
# Create a separate local.properties file with these values:
# RELEASE_STORE_FILE=path/to/keystore.jks
# RELEASE_STORE_PASSWORD=your_keystore_password
# RELEASE_KEY_ALIAS=your_key_alias
# RELEASE_KEY_PASSWORD=your_key_password

# Firebase Configuration
# Add google-services.json to app/ directory for each variant
# Create separate Firebase projects for dev/staging/prod if needed

# Build Variants
# ./gradlew assembleDevDebug     - Development debug build
# ./gradlew assembleDevRelease   - Development release build
# ./gradlew assembleStagingDebug - Staging debug build
# ./gradlew assembleStagingRelease - Staging release build
# ./gradlew assembleProdDebug    - Production debug build
# ./gradlew assembleProdRelease  - Production release build

# Proguard/R8 Configuration
# Proguard rules are in app/proguard-rules.pro
# R8 is enabled by default in release builds
